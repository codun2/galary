services:
  db:
    image: mysql:8
    container_name: showroom-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: showroom
      MYSQL_USER: showroom
      MYSQL_PASSWORD: showroom
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3395:3306"
    volumes:
      - showroom_db:/var/lib/mysql

  backend:
    build:
      context: ./docker/php
    container_name: showroom-backend
    restart: unless-stopped
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend:/app
    ports:
      - "8095:8000"
    depends_on:
      - db

  frontend:
    image: node:20
    container_name: showroom-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable >/dev/null 2>&1; yarn install --network-timeout 600000 && yarn dev --host 0.0.0.0 --port 3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8095/api
    volumes:
      - ./frontend:/app
    ports:
      - "3095:3000"
    depends_on:
      - backend

volumes:
  showroom_db:
